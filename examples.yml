name: examples

on:
  push:
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 开店投资示例
        run: python scripts/montecarlo.py examples/store_opening.json --trials 2000 --seed 42
      - name: 最小配置示例（含 JSON 输出）
        run: python scripts/montecarlo.py examples/minimal.json --trials 2000 --seed 7 --json out/result.json
